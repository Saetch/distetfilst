networks:
  node-network:
volumes:
  bootstrap-volume:

services:
  node:
    build:
      context: ./node
      dockerfile: Dockerfile
    networks:
      - node-network
    volumes:
      - /data
    depends_on:
      - bootstrap
      - nats-seed

  bootstrap:
    container_name: bootstrap_container
    build:
      context: ./bootstrap
      dockerfile: Dockerfile
    networks:
      - node-network
    volumes:
      - bootstrap-volume:/data


  nats-seed:
    image: nats:latest
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
    volumes:
      - ./nats/nats_conf/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "4200:4222"
      - "8200:8222"
    expose:
      - "6222"
    networks:
      - node-network